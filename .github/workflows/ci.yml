name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    name: Quality gate (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh] # Windows PowerShell 5.1 and PowerShell 7
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Lint and test
        run: ./build/Invoke-QualityGate.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shell }}
          path: TestResults/

  package:
    name: Build release package
    needs: quality-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip and checksum
        shell: powershell
        run: ./build/New-WUMonitorPackage.ps1 -SkipQualityGate
      - uses: actions/upload-artifact@v4
        with:
          name: WUMonitor-package
          path: dist/
